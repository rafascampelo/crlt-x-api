name: Automatic protected PRs

on:
  workflow_run:
    workflows: ['Backend CI']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: auto-promote-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'develop' ||
       startsWith(github.event.workflow_run.head_branch, 'feature/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: promotion
    steps:
      # Never check out the triggering feature branch or download its artifacts.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Create repository-scoped automation token
        id: app
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.PROMOTION_APP_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open PR and request protected auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python -m scripts.auto_promote
