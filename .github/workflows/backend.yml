name: Backend CI

on:
  pull_request:
    branches: [develop, prod]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: ['feature/**', develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enforce feature to develop and develop to prod
        run: python -m scripts.branch_policy

  ci:
    name: Backend CI
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://ctrlx_ci:ci_only_password@127.0.0.1:3306/ctrlx_ci
      TEST_DATABASE_URL: mysql+pymysql://ctrlx_ci:ci_only_password@127.0.0.1:3306/ctrlx_ci
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ctrlx_ci
          MYSQL_USER: ctrlx_ci
          MYSQL_PASSWORD: ci_only_password
          MYSQL_ROOT_PASSWORD: ci_only_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_only_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Validate workflow syntax and shell commands
        run: >-
          docker run --rm --volume "$PWD/.github:/repo/.github:ro" --workdir /repo
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
          /repo/.github/workflows/backend.yml /repo/.github/workflows/deploy-production.yml
          /repo/.github/workflows/auto-promote.yml
      - name: Ruff
        run: python -m ruff check .
      - name: Validate isolated database target
        run: python -m scripts.ci_database
      - name: Validate Alembic upgrade, drift and downgrade
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check
      - name: Pytest with real MySQL
        run: python -m pytest --junitxml=reports/pytest.xml
      - name: Build Docker with Tesseract
        run: docker build --progress=plain --tag ctrlx-backend:${{ github.sha }} .
      - name: Verify OCR languages and container health
        env:
          IMAGE: ctrlx-backend:${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python "$IMAGE" -c "import pytesseract; assert {'por','eng'} <= set(pytesseract.get_languages())"
          docker run --detach --name ctrlx-smoke --publish 127.0.0.1:8000:8080 \
            --add-host mysql-ci.railway.internal:host-gateway --env PORT=8080 \
            --env APP_ENV=production --env SECRET_KEY=synthetic-ci-secret-not-for-production-123456 \
            --env CORS_ORIGINS=https://frontend.example.test \
            --env DATABASE_URL=mysql+pymysql://ctrlx_ci:ci_only_password@mysql-ci.railway.internal:3306/ctrlx_ci "$IMAGE"
          for _ in $(seq 1 30); do
            state=$(docker inspect --format '{{json .State.Health.Status}}' ctrlx-smoke)
            if [ "$state" = '"healthy"' ]; then
              python -c "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5); assert r.status==200 and json.load(r)=={'status':'ok'}"
              exit 0
            fi
            sleep 2
          done
          echo '::error::Container did not become healthy'
          exit 1
      - name: Container diagnostics
        if: failure()
        run: |
          if docker container inspect ctrlx-smoke > /dev/null 2>&1; then
            docker logs --tail 100 ctrlx-smoke
          fi
      - name: Collect test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Package validated release source
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        run: |
          tar --exclude='__pycache__' --exclude='*.pyc' -czf release.tar.gz Dockerfile .dockerignore .railwayignore railway.json requirements.lock app alembic alembic.ini scripts
          sha256sum release.tar.gz > release.tar.gz.sha256
      - name: Save release source
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-release-${{ github.sha }}
          path: |
            release.tar.gz
            release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
