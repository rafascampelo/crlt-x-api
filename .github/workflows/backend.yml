name: Backend CI-CD

on:
  pull_request:
    branches: [develop, prod]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [develop, prod]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enforce develop-to-prod release path
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'prod'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          test "$HEAD_BRANCH" = develop || { echo '::error::PRs to prod must come from develop'; exit 1; }
      - name: Validate every pull request commit
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/validate_commit_messages.py --pr

  ci:
    name: Backend CI
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://ctrlx_ci:ci_only_password@127.0.0.1:3306/ctrlx_ci
      TEST_DATABASE_URL: mysql+pymysql://ctrlx_ci:ci_only_password@127.0.0.1:3306/ctrlx_ci
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ctrlx_ci
          MYSQL_USER: ctrlx_ci
          MYSQL_PASSWORD: ci_only_password
          MYSQL_ROOT_PASSWORD: ci_only_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_only_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Ruff
        run: python -m ruff check .
      - name: Validate isolated database target
        run: python -m scripts.ci_database
      - name: Validate Alembic upgrade, drift and downgrade
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check
      - name: Pytest with real MySQL
        run: python -m pytest --junitxml=reports/pytest.xml
      - name: Build Docker with Tesseract
        run: docker build --progress=plain --tag ctrlx-backend:${{ github.sha }} .
      - name: Verify OCR languages and container health
        env:
          IMAGE: ctrlx-backend:${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python "$IMAGE" -c "import pytesseract; assert {'por','eng'} <= set(pytesseract.get_languages())"
          docker run --detach --name ctrlx-smoke --publish 127.0.0.1:8000:8080 --env PORT=8080 "$IMAGE"
          for attempt in $(seq 1 30); do
            state=$(docker inspect --format '{{json .State.Health.Status}}' ctrlx-smoke)
            if [ "$state" = '"healthy"' ]; then
              python -c "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5); assert r.status==200 and json.load(r)=={'status':'ok'}"
              exit 0
            fi
            sleep 2
          done
          echo '::error::Container did not become healthy'
          exit 1
      - name: Container diagnostics
        if: failure()
        run: |
          if docker container inspect ctrlx-smoke > /dev/null 2>&1; then
            docker logs --tail 100 ctrlx-smoke
          fi
      - name: Collect test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Package validated release source
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        run: |
          tar --exclude='__pycache__' --exclude='*.pyc' -czf release.tar.gz Dockerfile .dockerignore .railwayignore requirements.lock app alembic alembic.ini scripts
          sha256sum release.tar.gz > release.tar.gz.sha256
      - name: Save release source
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-release-${{ github.sha }}
          path: |
            release.tar.gz
            release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  production:
    name: Backend production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.BACKEND_PRODUCTION_URL }}
    concurrency:
      group: backend-production
      cancel-in-progress: false
    steps:
      - name: Reject superseded release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/prod" --jq '.object.sha')
          test "$current" = "$EXPECTED_SHA" || { echo '::error::prod has advanced; refusing stale release'; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-release-${{ github.sha }}
      - name: Verify and extract validated source
        run: |
          sha256sum --check release.tar.gz.sha256
          mkdir release
          tar -xzf release.tar.gz -C release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.74.0
      - name: Deploy and verify production
        working-directory: release
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          BACKEND_PRODUCTION_URL: ${{ vars.BACKEND_PRODUCTION_URL }}
        run: python -m scripts.deploy_railway
